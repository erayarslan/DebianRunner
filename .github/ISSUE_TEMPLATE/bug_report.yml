name: Bug report
description: Report a reproducible DebianRunner problem.
title: "[Bug] "
body:
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Device model, iOS or iPadOS version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DebianRunner version and build
      description: Settings → About DebianRunner. Include source revision or IPA checksum if known.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Package and execution mode
      placeholder: Affected Debian package/version, interpreter or JIT mode
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Steps, expected behavior, actual behavior and the first relevant error.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or screenshots
      description: Review exports for private information. Do not attach credentials, personal messages or signing material. Report vulnerabilities through the private security form.
