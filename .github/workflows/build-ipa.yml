name: Build DebianRunner IPA

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      jit:
        description: 'Include optional ARM64 JIT translator (LINUXRUNNER_JIT=YES)'
        required: false
        type: boolean
        default: false
      diagnostic:
        description: 'Build diagnostic variant (--diagnostic)'
        required: false
        type: boolean
        default: false
      bundle_id:
        description: 'Root bundle identifier'
        required: false
        type: string
        default: 'dev.debianrunner.app'

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'dev.debianrunner.app' }}
      LINUXRUNNER_JIT: ${{ github.event.inputs.jit == 'true' && 'YES' || 'NO' }}
      DIAGNOSTIC: ${{ github.event.inputs.diagnostic == 'true' && 'YES' || 'NO' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required submodules
        run: |
          git submodule sync -- deps/libapps deps/libarchive
          git submodule update --init --recursive --checkout -- deps/libapps deps/libarchive

      - name: Install macOS build tools (meson, ninja, lld)
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install meson ninja lld
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Check toolchain and support manifests
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          scripts/bootstrap-macos.sh
          python3 scripts/generate-support-manifest.py --check
          sh tests/linuxrunner/package/classify_failure_test.sh

      - name: Build unsigned DebianRunner IPA
        run: |
          flags=(--unsigned)
          artifact="DebianRunner"
          if [[ "${DIAGNOSTIC}" == "YES" ]]; then
            flags+=(--diagnostic)
            artifact="DebianRunner-Debug"
          fi
          if [[ "${LINUXRUNNER_JIT}" == "YES" ]]; then
            artifact="${artifact}-JIT"
          fi
          echo "ARTIFACT_NAME=${artifact}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            export MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ARTIFACT_NAME="${artifact}" \
          BUNDLE_ID="${BUNDLE_ID}" \
          LINUXRUNNER_JIT="${LINUXRUNNER_JIT}" \
          RELEASE_DIR="$PWD/build/releases" \
          scripts/build-ipa.sh "${flags[@]}"

      - name: Verify IPA
        run: |
          verify_flags=()
          if [[ "${DIAGNOSTIC}" == "YES" ]]; then
            verify_flags+=(--diagnostic)
          fi
          ARTIFACT_NAME="${ARTIFACT_NAME}" \
          LINUXRUNNER_JIT="${LINUXRUNNER_JIT}" \
          LINUXRUNNER_VERIFY_SOURCE_TREE="$PWD" \
          LINUXRUNNER_EXPECTED_SOURCE_COMMIT="${GITHUB_SHA}" \
          python3 scripts/verify-ipa.py build/releases "${verify_flags[@]}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ github.run_number }}
          retention-days: 1
          path: |
            build/releases/${{ env.ARTIFACT_NAME }}.ipa
            build/releases/${{ env.ARTIFACT_NAME }}.ipa.sha256
            build/releases/${{ env.ARTIFACT_NAME }}.validation.json
            build/releases/artifact-verification.json
            build/releases/SIGNING-STATUS.txt

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          retention-days: 1
          if-no-files-found: ignore
          path: |
            build/releases/archive.log
            build/releases/*.json

      - name: Print archive log tail on failure
        if: failure()
        run: |
          if [[ -f build/releases/archive.log ]]; then
            echo "=== Last 200 lines of build/releases/archive.log ==="
            tail -n 200 build/releases/archive.log
          fi

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            "build/releases/${ARTIFACT_NAME}.ipa" \
            "build/releases/${ARTIFACT_NAME}.ipa.sha256" \
            "build/releases/${ARTIFACT_NAME}.validation.json" \
            "build/releases/artifact-verification.json" \
            --title "DebianRunner ${TAG}" \
            --notes "Unsigned ARM64 iOS IPA for headless Debian 13 (trixie) minimal. Sideload with AltStore, SideStore, Sideloadly, or TrollStore." \
            || gh release upload "${TAG}" \
            "build/releases/${ARTIFACT_NAME}.ipa" \
            "build/releases/${ARTIFACT_NAME}.ipa.sha256" \
            "build/releases/${ARTIFACT_NAME}.validation.json" \
            "build/releases/artifact-verification.json" \
            --clobber
